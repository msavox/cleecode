name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS is the supported platform, so this one gates.
  test:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: cargo test --locked
      # Smoke-check the flags that don't need a terminal, so a released binary can at
      # least identify itself (Homebrew's `brew test` relies on --version).
      - run: ./target/release/clee --version
      - run: ./target/release/clee --help

  # Linux and Windows ship as experimental binaries: the code compiles and the binary starts
  # there, but nothing interactive has been exercised. Non-blocking, so a break on a platform
  # nobody has run yet doesn't stop work on macOS — the status stays visible either way.
  other-platforms:
    name: Build and smoke-check (${{ matrix.os }}, experimental)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux needs X11/clipboard headers for arboard; without them the failure would be a
      # missing system library rather than anything about our code.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --locked --release
      - run: cargo test --locked
      # Proves the binary actually starts and resolves its dynamic libraries on this OS.
      # Both flags return before the TUI is initialised, so no tty is required.
      - shell: bash
        run: |
          set -euo pipefail
          bin="target/release/clee"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="${bin}.exe"; fi
          "$bin" --version
          "$bin" --help

  # Reported, not enforced: the tree is not rustfmt-formatted and clippy has warnings.
  # Adopting either is a repo-wide change, so it stays a deliberate decision.
  lints:
    name: Lints (informational)
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
