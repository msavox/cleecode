name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS is the supported platform, so this one gates.
  test:
    name: Build and test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: cargo test --locked
      # Smoke-check the flags that don't need a terminal, so a released binary can at
      # least identify itself (Homebrew's `brew test` relies on --version).
      - run: ./target/release/clee --version
      - run: ./target/release/clee --help

  # Linux and Windows ship as experimental binaries: the code compiles and the binary starts
  # there, but nothing interactive has been exercised. Non-blocking, so a break on a platform
  # nobody has run yet doesn't stop work on macOS — the status stays visible either way.
  other-platforms:
    name: Build and smoke-check (${{ matrix.os }}, experimental)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Linux needs X11/clipboard headers for arboard; without them the failure would be a
      # missing system library rather than anything about our code.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --locked --release
      - run: cargo test --locked
      # Proves the binary actually starts and resolves its dynamic libraries on this OS.
      # Both flags return before the TUI is initialised, so no tty is required.
      - shell: bash
        run: |
          set -euo pipefail
          bin="target/release/clee"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="${bin}.exe"; fi
          "$bin" --version
          "$bin" --help

  # The pty drivers are the only exercise of the interactive surface — everything else here
  # checks that the binary starts, not that it behaves once a key is pressed. They have only
  # ever run on the author's Mac, so continue-on-error stays on until the job is seen green on
  # both runners; promoting it to a gate is a deliberate decision, same stance as lints below.
  drivers:
    name: Pty drivers (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # Debug, not release: the drivers spawn target/debug/clee by default, and there is no
      # reason to pay for a release build just to drive keystrokes at it.
      - run: cargo build --locked
      # Which pip needs --break-system-packages (PEP 668) and which one has never heard of the
      # flag varies by runner image and drifts over time, so asking is more reliable than
      # hardcoding an OS guess: try the plain install first, and only add the flag if that
      # install was the one refused.
      - run: python3 -m pip install --user pyte || python3 -m pip install --user --break-system-packages pyte
      # drive_git.py makes real commits in a throwaway repo it creates; git refuses to commit
      # without an identity, and a fixed default branch name keeps its output stable across
      # whatever the runner image's global default happens to be.
      - run: |
          git config --global user.email ci@cleecode.invalid
          git config --global user.name "CleeCode CI"
          git config --global init.defaultBranch master
      # These eight are the deterministic subset: no Octave, no matplotlib, no display. The rest
      # (drive_cells, drive_workspace, drive_figures, drive_presets, drive_inspect, drive_debug,
      # drive_python) need real interpreters and stay manual for now — each is its own step so a
      # failure names itself rather than hiding in a combined log.
      - run: python3 scripts/drive_ui.py target/debug/clee
      - run: python3 scripts/drive_jump.py target/debug/clee
      - run: python3 scripts/drive_git.py target/debug/clee
      - run: python3 scripts/drive_lsp.py target/debug/clee
      # Writes files in a throwaway tree and reads the bytes back, which is the only way to check
      # a line ending survived — nothing installed, nothing on the network.
      - run: python3 scripts/drive_replace.py target/debug/clee
      # Needs nothing installed either: the agent's side of the MCP bridge is a second copy of
      # the same binary, spoken to on a pipe.
      - run: python3 scripts/drive_mcp.py target/debug/clee
      # Writes its own animated GIF byte by byte, so it needs no image library and no fixture:
      # what it watches is a pane changing on the file's own clock with nothing pressed.
      - run: python3 scripts/drive_gif.py target/debug/clee
      # Stubs the agents it needs onto the front of PATH, so it needs no real agent installed —
      # and on a runner where none of the four is, its "not installed" checks run rather than
      # skip, which is the half a developer's laptop usually cannot exercise.
      - run: python3 scripts/drive_drawer.py target/debug/clee
      # Debugs a C program it compiles itself, through the real adapter: it skips with a sentence
      # on ubuntu-22.04, whose gdb is 12 and has no DAP in it, and runs for real on macos-14, where
      # Xcode's lldb-dap answers.
      - run: python3 scripts/drive_dap.py target/debug/clee

  # Reported, not enforced: the tree is not rustfmt-formatted and clippy has warnings.
  # Adopting either is a repo-wide change, so it stays a deliberate decision.
  lints:
    name: Lints (informational)
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
