name: Release

# Tag a commit to publish: `git tag v0.2.0 && git push origin v0.2.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true
      only:
        description: "Attach one artifact only (slug, e.g. linux-arm64 or linux-x86_64-deb). Empty attaches all."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tagging v0.13.0 with Cargo.toml still at 0.12.5 would happily build and publish binaries
  # that report the wrong version — the formula's assert would only catch it at install time,
  # after the release is already out. Fail here instead, before anything is built. A grep keeps
  # this job seconds long; there is no reason to stand up a Rust toolchain just to read a line
  # out of Cargo.toml.
  guard:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v${version}" != "$tag" ]; then
            echo "Tag ${tag} does not match Cargo.toml version ${version} (expected v${version})." >&2
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            # Runs natively on the runner, so the built binary can be smoke-checked.
            smoke: true
          - label: macOS x86_64
            os: macos-14
            target: x86_64-apple-darwin
            slug: macos-x86_64
            # Cross-built on an arm64 runner, which has no Rosetta: it cannot be run here.
            smoke: false
          # Built on the oldest supported Ubuntu image so the glibc it links against is old
          # enough for current distributions, not just the newest.
          - label: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            smoke: true
            # The Debian package is built here, from the binary this job already built and
            # smoke-checked, and attached under its own slug — `linux-x86_64-deb`.
            deb: true
            debarch: amd64
          # GitHub's arm64 Linux runners are free for public repositories, so this builds
          # natively and gets the same smoke-check as everything else — no cross toolchain,
          # no qemu, and a binary that has actually started once on the architecture it is
          # named for. Same reason as x86_64 for the older image: glibc.
          - label: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            smoke: true
            # Same runner arrangement as the archive above: native, so dpkg-deb packages a
            # binary that has already started on the architecture the package names.
            deb: true
            debarch: arm64
          - label: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            smoke: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # arboard links against X11/xcb for clipboard access.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Not an interactive test, but it proves the binary starts and that its dynamic
      # libraries resolve on this OS — which for Linux and Windows is more than we knew
      # before. Both flags return before the TUI is initialised, so no tty is needed.
      - name: Smoke-check the binary
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/clee"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="${bin}.exe"; fi
          "$bin" --version
          "$bin" --help

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="clee-${tag}-${{ matrix.slug }}"
          bin="clee"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="clee.exe"; fi

          mkdir -p "dist/${name}/fonts"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # The man page travels with the archive too, for anyone installing by hand rather
          # than through Homebrew.
          cp docs/clee.1 "dist/${name}/"
          # Ship the font alongside, so --install-font isn't the only way to get it.
          cp assets/fonts/CleeCodeMonoNerdFont-Regular.ttf assets/fonts/OFL.txt "dist/${name}/fonts/"

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="${name}.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" "$name"
          fi

          # sha256sum on Linux and Git Bash, shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"

      # The Debian package, from the same binary the archive above just shipped. Its Depends
      # line is not written by hand: every shared library the binary actually links is read
      # back with ldd and resolved to the package that owns it with dpkg -S, on the oldest
      # supported Ubuntu — so the list is derived from the build, and a new dependency slipping
      # into the binary shows up here as a changed Depends rather than as a broken install on
      # someone's machine. --root-owner-group spares us fakeroot: dpkg-deb records root
      # ownership directly.
      - name: Package the Debian archive
        id: deb
        if: matrix.deb
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          bin="target/${{ matrix.target }}/release/clee"
          name="clee-${tag}-${{ matrix.slug }}"

          # A dispatch that retro-attaches the .deb to a tag older than the packaging itself
          # checks out a tree with no packaging/deb in it. The inputs are then taken from the
          # commit this workflow run was started from — for a tag push that is the tag's own
          # sha, so ordinary releases still build purely from the tag; only the retro-attach
          # reaches forward, which is the whole point of dispatching it.
          if [ ! -d packaging/deb ]; then
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}" -- packaging/deb
          fi

          staging="debroot"
          mkdir -p "${staging}/DEBIAN" \
                   "${staging}/usr/bin" \
                   "${staging}/usr/share/man/man1" \
                   "${staging}/usr/share/applications" \
                   "${staging}/usr/share/doc/clee"
          install -m 755 "$bin" "${staging}/usr/bin/clee"
          gzip -9n < docs/clee.1 > "${staging}/usr/share/man/man1/clee.1.gz"
          install -m 644 packaging/deb/clee.desktop "${staging}/usr/share/applications/clee.desktop"
          install -m 644 LICENSE "${staging}/usr/share/doc/clee/copyright"

          depends=$(ldd "$bin" | awk '/=>/ && $3 != "" {print $3}' \
            | xargs -r dpkg -S 2>/dev/null | cut -d: -f1 | sort -u | paste -sd, - | sed 's/,/, /g')
          size_kb=$(du -sk "$staging" | cut -f1)
          sed -e "s/@VERSION@/${version}/" \
              -e "s/@ARCH@/${{ matrix.debarch }}/" \
              -e "s/@DEPENDS@/${depends}/" \
              -e "s/@INSTALLED_SIZE@/${size_kb}/" \
              packaging/deb/control.in > "${staging}/DEBIAN/control"
          cat "${staging}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$staging" "dist/${name}.deb"
          # The package has to survive its own round trip before it is published: dpkg-deb
          # reads the control and the file list back out of the built package, so what is
          # printed in the log is what an installer will see, not what this script meant.
          dpkg-deb --info "dist/${name}.deb"
          dpkg-deb --contents "dist/${name}.deb"
          cd dist
          sha256sum "${name}.deb" > "${name}.deb.sha256"
          cat "${name}.deb.sha256"
          echo "deb=dist/${name}.deb" >> "$GITHUB_OUTPUT"

      # Adding a platform to a release that is already out: everything still builds, so the
      # tag is checked on every target, but only the named archive is attached. The four that
      # are already published keep the bytes and the checksums they were published with —
      # rebuilding them would replace both, and a checksum that changes under whoever already
      # downloaded the file is the one thing a release must never do.
      - name: Upload to the release
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == matrix.slug }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # The first matrix job to finish creates the release; the rest add their files.
          # Notes live in a file rather than a heredoc, which inside this indented block
          # would need its terminator at column zero.
          #
          # Two jobs can pass the "does it exist" check at the same moment and both try to
          # create it — which is exactly what happened on v0.5.1: the second one got a 422,
          # failed before uploading, and the release went out without its Linux archive. The
          # create is allowed to lose that race, since losing it means the release is there.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes-file .github/release-notes.md \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

      # The .deb travels under its own slug — `linux-x86_64-deb`, `linux-arm64-deb` — so it can
      # be added to a release that is already out without the archive beside it being rebuilt
      # and re-attached: the dispatch that validates this very step on an existing tag names
      # the deb slug and nothing else, and the published tarballs keep their checksums.
      - name: Upload the Debian archive to the release
        if: ${{ matrix.deb && (github.event.inputs.only == '' || github.event.inputs.only == format('{0}-deb', matrix.slug)) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes-file .github/release-notes.md \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" \
            "${{ steps.deb.outputs.deb }}" \
            "${{ steps.deb.outputs.deb }}.sha256" \
            --clobber

  # Prints the checksum the Homebrew formula needs for the source tarball, so the tap can be
  # updated without building anything locally.
  homebrew-checksum:
    name: Homebrew source checksum
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Compute sha256 of the tag's source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          # GitHub answers an anonymous archive request under load with a 200 and a
          # two-line "429: Too Many Requests" body. Hashing that ships a checksum no
          # user can ever match, so authenticate, retry, and refuse anything that is
          # not a readable tarball.
          for attempt in 1 2 3 4 5; do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$url" -o source.tar.gz && \
              tar -tzf source.tar.gz >/dev/null 2>&1 && break
            if [ "$attempt" = 5 ]; then
              echo "Could not fetch a valid source tarball from ${url}:" >&2
              head -c 400 source.tar.gz >&2 || true
              exit 1
            fi
            sleep $((attempt * 15))
          done
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          {
            echo "### Homebrew formula values for \`${tag}\`"
            echo
            echo '```ruby'
            echo "  url \"${url}\""
            echo "  sha256 \"${sum}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
