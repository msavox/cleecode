name: Release

# Tag a commit to publish: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="clee-${tag}-macos-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/clee" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # The font ships alongside so `--install-font` isn't the only way to get it.
          mkdir -p "dist/${name}/fonts"
          cp assets/fonts/CleeCodeMonoNerdFont-Regular.ttf assets/fonts/OFL.txt "dist/${name}/fonts/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          shasum -a 256 "dist/${name}.tar.gz" | tee "dist/${name}.tar.gz.sha256"
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Create the release on first upload; later matrix jobs just add their files.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber

  # Prints the checksum the Homebrew formula needs for the source tarball, so the tap can be
  # updated without building anything locally.
  homebrew-checksum:
    name: Homebrew source checksum
    needs: macos
    runs-on: ubuntu-24.04
    steps:
      - name: Compute sha256 of the tag's source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          {
            echo "### Homebrew formula values for \`${tag}\`"
            echo
            echo '```ruby'
            echo "  url \"${url}\""
            echo "  sha256 \"${sum}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
