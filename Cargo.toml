[package]
name = "cleecode"
version = "0.24.1"
edition = "2024"
description = "A terminal IDE: editor with a file-tree sidebar, embedded terminals, syntax highlighting and a run button"
authors = ["Matteo Savoia"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/msavox/cleecode"
homepage = "https://github.com/msavox/cleecode"
keywords = ["editor", "terminal", "tui", "ide", "ratatui"]
categories = ["text-editors", "command-line-utilities"]
# Screenshots, the demo GIF and CI config aren't needed to build; docs/clee.1 is, because the
# Homebrew formula installs the man page from the source tree. assets/ must stay too: the font is
# include_bytes!-ed into the binary for --install-font, so excluding it breaks the build.
exclude = ["docs/screenshots/", "docs/demo.gif", "docs/social-preview.png", ".github/"]

# The crate stays "cleecode" but the built command is the shorter "clee".
[[bin]]
name = "clee"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.4.1"
base64 = "0.23.1"
crossterm = "0.29.0"
dirs = "6.0.0"
# The regex engine for Find. Deliberately fancy-regex rather than `regex`: syntect already pulls
# it in for `regex-fancy`, so it is compiled into the binary either way and asking for it here
# adds no crate, no build time and no C. It also backtracks, which is what makes lookaround work,
# and it has a backtrack limit — a pattern typed by hand that would otherwise hang returns an
# error the overlay can show instead of freezing the editor.
fancy-regex = "0.16.2"
image = "0.25.10"
lsp-types = "0.97.0"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd", "html"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
# The highlighting engine, with its own grammars turned off: two-face supplies bat's set
# instead — syntect's defaults plus TypeScript, TOML, Kotlin, Swift, Zig, Dockerfile, Vue and
# a hundred more — and shipping both would put two dumps of the same grammars in the binary.
# The themes stay syntect's, since that is where base16-ocean.dark comes from. `regex-fancy`
# keeps the build pure Rust (the alternative, onig, needs a C compiler), so two-face is asked
# for the matching flavour.
syntect = { version = "5.3.0", default-features = false, features = ["default-themes", "parsing", "regex-fancy"] }
sysinfo = "0.33.1"
toml = "1.1.4"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
vt100 = "0.16.2"

# Unix-only: one call, `tcgetattr` on a pty master, to ask whether the shell in a pane has put
# the terminal into raw mode — which is how CleeCode tells "a prompt is reading keys" from "the
# rc is still running". portable-pty already compiles libc, so this adds no crate and no build
# time; it only makes the dependency one this code states for itself.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: register the bundled Nerd Font with the OS so `--install-font` makes it
# usable immediately (registry entry + AddFontResourceW into the GDI session).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59.0", features = ["Win32_Graphics_Gdi"] }
winreg = "0.52.0"

# Dependencies are optimised even in a debug build, the crate itself is not.
#
# Previews do real arithmetic — decoding a 4K photograph, resampling it to the pane — inside
# `image`, and unoptimised that is tens of times slower: `cargo run` took seconds to show a
# picture that the release build shows in a tenth of one, which is long enough to look like a
# bug in CleeCode rather than in the build profile. Dependencies rarely need stepping through,
# so they are compiled properly; our own code stays debuggable and quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
