[package]
name = "cleecode"
version = "0.4.0"
edition = "2024"
description = "A terminal IDE: editor with a file-tree sidebar, embedded terminals, syntax highlighting and a run button"
authors = ["Matteo Savoia"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/msavox/cleecode"
homepage = "https://github.com/msavox/cleecode"
keywords = ["editor", "terminal", "tui", "ide", "ratatui"]
categories = ["text-editors", "command-line-utilities"]
# Screenshots, the demo GIF and CI config aren't needed to build; docs/clee.1 is, because the
# Homebrew formula installs the man page from the source tree. assets/ must stay too: the font is
# include_bytes!-ed into the binary for --install-font, so excluding it breaks the build.
exclude = ["docs/screenshots/", "docs/demo.gif", "docs/social-preview.png", ".github/"]

# The crate stays "cleecode" but the built command is the shorter "clee".
[[bin]]
name = "clee"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.4.1"
crossterm = "0.29.0"
dirs = "6.0.0"
image = "0.25.10"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd", "html"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
sysinfo = "0.33.1"
toml = "1.1.4"
vt100 = "0.16.2"

# Windows-only: register the bundled Nerd Font with the OS so `--install-font` makes it
# usable immediately (registry entry + AddFontResourceW into the GDI session).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59.0", features = ["Win32_Graphics_Gdi"] }
winreg = "0.52.0"
